<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <rect width="700" height="420" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="350" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#222">CAT 06 — 8051 UART Serial Echo</text>
  <text x="350" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">AT89S52 · UART Mode 1 · 9600 Baud · Timer 1 Baud Generator · PC Serial Echo</text>

  <!-- AT89S52 -->
  <rect x="220" y="80" width="160" height="240" rx="8" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <text x="300" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">AT89S52</text>
  <text x="300" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">40-pin DIP</text>

  <!-- Left pins -->
  <text x="215" y="150" text-anchor="end" font-family="Arial" font-size="10" fill="#333">VCC (40)</text>
  <line x1="220" y1="148" x2="195" y2="148" stroke="#e74c3c" stroke-width="2"/>

  <text x="215" y="172" text-anchor="end" font-family="Arial" font-size="10" fill="#333">GND (20)</text>
  <line x1="220" y1="170" x2="195" y2="170" stroke="#2c3e50" stroke-width="2"/>

  <text x="215" y="194" text-anchor="end" font-family="Arial" font-size="10" fill="#333">XTAL1 (19)</text>
  <line x1="220" y1="192" x2="195" y2="192" stroke="#8e44ad" stroke-width="2"/>

  <text x="215" y="216" text-anchor="end" font-family="Arial" font-size="10" fill="#333">XTAL2 (18)</text>
  <line x1="220" y1="214" x2="195" y2="214" stroke="#8e44ad" stroke-width="2"/>

  <text x="215" y="238" text-anchor="end" font-family="Arial" font-size="10" fill="#333">RST (9)</text>
  <line x1="220" y1="236" x2="195" y2="236" stroke="#e67e22" stroke-width="2"/>

  <!-- Right pins -->
  <text x="385" y="150" text-anchor="start" font-family="Arial" font-size="10" fill="#27ae60">TXD / P3.1 (11)</text>
  <line x1="380" y1="148" x2="420" y2="148" stroke="#27ae60" stroke-width="2"/>

  <text x="385" y="172" text-anchor="start" font-family="Arial" font-size="10" fill="#2980b9">RXD / P3.0 (10)</text>
  <line x1="380" y1="170" x2="420" y2="170" stroke="#2980b9" stroke-width="2"/>

  <!-- Crystal -->
  <rect x="125" y="185" width="50" height="25" rx="4" fill="#f39c12" stroke="#888" stroke-width="1.5"/>
  <text x="150" y="202" text-anchor="middle" font-family="Arial" font-size="10" fill="white">11.0592MHz</text>
  <line x1="125" y1="192" x2="115" y2="192" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="175" y1="192" x2="195" y2="192" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="125" y1="205" x2="115" y2="205" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="175" y1="205" x2="195" y2="214" stroke="#8e44ad" stroke-width="1.5"/>

  <!-- GND bus -->
  <line x1="195" y1="170" x2="175" y2="170" stroke="#2c3e50" stroke-width="2"/>
  <line x1="175" y1="170" x2="175" y2="310" stroke="#2c3e50" stroke-width="2"/>
  <line x1="175" y1="310" x2="560" y2="310" stroke="#2c3e50" stroke-width="2"/>
  <text x="368" y="325" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">GND</text>

  <!-- VCC -->
  <line x1="195" y1="148" x2="175" y2="148" stroke="#e74c3c" stroke-width="2"/>
  <line x1="175" y1="148" x2="175" y2="80" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="175" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c">+5V</text>

  <!-- MAX232 / USB-UART -->
  <rect x="440" y="110" width="100" height="80" rx="6" fill="#2c3e50" stroke="#aaa" stroke-width="2"/>
  <text x="490" y="140" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">USB-UART</text>
  <text x="490" y="158" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">Adapter</text>
  <text x="490" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">(CP2102/CH340)</text>

  <!-- TXD MCU -> RXD Adapter -->
  <line x1="420" y1="148" x2="440" y2="148" stroke="#27ae60" stroke-width="2"/>
  <text x="430" y="143" text-anchor="middle" font-family="Arial" font-size="8" fill="#27ae60">RXD</text>

  <!-- RXD MCU -> TXD Adapter -->
  <line x1="420" y1="170" x2="440" y2="170" stroke="#2980b9" stroke-width="2"/>
  <text x="430" y="165" text-anchor="middle" font-family="Arial" font-size="8" fill="#2980b9">TXD</text>

  <!-- USB to PC -->
  <rect x="570" y="130" width="80" height="40" rx="6" fill="#3498db" stroke="#aaa" stroke-width="2"/>
  <text x="610" y="155" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">PC / Terminal</text>
  <line x1="540" y1="150" x2="570" y2="150" stroke="#95a5a6" stroke-width="3"/>
  <text x="555" y="145" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">USB</text>

  <!-- GND adapter -->
  <line x1="490" y1="190" x2="490" y2="310" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- Settings label -->
  <rect x="80" y="345" width="540" height="55" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="350" y="363" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">UART Settings</text>
  <text x="350" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">SCON = 0x50 (Mode 1, REN=1) · TMOD = 0x20 (Timer 1, Mode 2) · TH1 = 0xFD → 9600 baud @ 11.0592 MHz</text>
  <text x="350" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">MCU receives byte → stores in SBUF → echoes back; use PuTTY / Tera Term at 9600 8N1</text>
</svg>
