<svg xmlns="http://www.w3.org/2000/svg" width="750" height="480" viewBox="0 0 750 480">
  <rect width="750" height="480" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="375" y="28" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#222">CAT 08 — 8051 4×4 Keypad + 7-Segment + 4 LEDs</text>
  <text x="375" y="46" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">AT89S52 · P2: Keypad rows/cols · P0: 7-segment (common-cathode) · P1: LEDs</text>

  <!-- AT89S52 -->
  <rect x="230" y="70" width="160" height="300" rx="8" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <text x="310" y="98" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">AT89S52</text>
  <text x="310" y="115" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">40-pin DIP</text>

  <!-- Left pins -->
  <text x="225" y="140" text-anchor="end" font-family="Arial" font-size="9" fill="#e74c3c">VCC (40)</text>
  <line x1="230" y1="138" x2="205" y2="138" stroke="#e74c3c" stroke-width="2"/>
  <text x="225" y="158" text-anchor="end" font-family="Arial" font-size="9" fill="#2c3e50">GND (20)</text>
  <line x1="230" y1="156" x2="205" y2="156" stroke="#2c3e50" stroke-width="2"/>
  <text x="225" y="176" text-anchor="end" font-family="Arial" font-size="9" fill="#8e44ad">XTAL1/2</text>
  <line x1="230" y1="174" x2="205" y2="174" stroke="#8e44ad" stroke-width="2"/>

  <!-- P2 for keypad (left) -->
  <text x="225" y="210" text-anchor="end" font-family="Arial" font-size="9" fill="#e67e22">P2.0–P2.3 (cols)</text>
  <line x1="230" y1="208" x2="205" y2="208" stroke="#e67e22" stroke-width="2"/>
  <text x="225" y="230" text-anchor="end" font-family="Arial" font-size="9" fill="#f39c12">P2.4–P2.7 (rows)</text>
  <line x1="230" y1="228" x2="205" y2="228" stroke="#f39c12" stroke-width="2"/>

  <!-- P0 for 7-seg (right) -->
  <text x="395" y="140" text-anchor="start" font-family="Arial" font-size="9" fill="#3498db">P0.0–P0.7 (segments)</text>
  <line x1="390" y1="138" x2="430" y2="138" stroke="#3498db" stroke-width="2"/>

  <!-- P1 for LEDs (right) -->
  <text x="395" y="175" text-anchor="start" font-family="Arial" font-size="9" fill="#27ae60">P1.1–P1.4 (LEDs)</text>
  <line x1="390" y1="173" x2="430" y2="173" stroke="#27ae60" stroke-width="2"/>

  <!-- 4×4 Keypad -->
  <rect x="30" y="175" width="140" height="140" rx="6" fill="#2c3e50" stroke="#aaa" stroke-width="2"/>
  <text x="100" y="198" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">4×4 Keypad</text>
  <!-- Keys grid mockup -->
  <text x="55" y="218" font-family="Arial" font-size="9" fill="#aaa">[1][2][3][A]</text>
  <text x="55" y="233" font-family="Arial" font-size="9" fill="#aaa">[4][5][6][B]</text>
  <text x="55" y="248" font-family="Arial" font-size="9" fill="#aaa">[7][8][9][C]</text>
  <text x="55" y="263" font-family="Arial" font-size="9" fill="#aaa">[*][0][#][D]</text>
  <text x="55" y="283" font-family="Arial" font-size="9" fill="#e67e22">Cols: P2.0–P2.3</text>
  <text x="55" y="296" font-family="Arial" font-size="9" fill="#f39c12">Rows: P2.4–P2.7</text>

  <!-- Connect keypad to MCU -->
  <line x1="170" y1="208" x2="205" y2="208" stroke="#e67e22" stroke-width="2"/>
  <line x1="170" y1="228" x2="205" y2="228" stroke="#f39c12" stroke-width="2"/>

  <!-- 7-Segment display -->
  <rect x="450" y="95" width="90" height="120" rx="6" fill="#34495e" stroke="#aaa" stroke-width="2"/>
  <text x="495" y="118" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">7-SEG</text>
  <text x="495" y="133" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">Common-Cathode</text>
  <!-- Segment display icon -->
  <text x="495" y="168" text-anchor="middle" font-family="Arial" font-size="36" fill="#e74c3c">8</text>
  <text x="495" y="204" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">a b c d e f g dp</text>

  <!-- Connect 7-seg -->
  <line x1="430" y1="138" x2="450" y2="138" stroke="#3498db" stroke-width="2"/>

  <!-- LEDs -->
  <circle cx="455" cy="250" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="455" y="254" text-anchor="middle" font-family="Arial" font-size="8" fill="white">L1</text>
  <circle cx="490" cy="250" r="12" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
  <text x="490" y="254" text-anchor="middle" font-family="Arial" font-size="8" fill="white">L2</text>
  <circle cx="525" cy="250" r="12" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="525" y="254" text-anchor="middle" font-family="Arial" font-size="8" fill="white">L3</text>
  <circle cx="560" cy="250" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="560" y="254" text-anchor="middle" font-family="Arial" font-size="8" fill="white">L4</text>
  <text x="508" y="236" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">LEDs (via 220Ω each)</text>
  <line x1="430" y1="173" x2="455" y2="238" stroke="#27ae60" stroke-width="1.5"/>

  <!-- GND bus -->
  <line x1="205" y1="156" x2="175" y2="156" stroke="#2c3e50" stroke-width="2"/>
  <line x1="175" y1="156" x2="175" y2="420" stroke="#2c3e50" stroke-width="2"/>
  <line x1="175" y1="420" x2="600" y2="420" stroke="#2c3e50" stroke-width="2"/>
  <text x="390" y="438" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">GND</text>

  <!-- VCC -->
  <line x1="205" y1="138" x2="175" y2="138" stroke="#e74c3c" stroke-width="2"/>
  <line x1="175" y1="138" x2="175" y2="70" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="175" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c">+5V</text>

  <!-- Notes table -->
  <rect x="30" y="345" width="690" height="100" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="375" y="363" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">Pin Assignment Summary</text>
  <text x="100" y="382" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P0 (pins 32-39)</text>
  <text x="100" y="397" text-anchor="middle" font-family="Arial" font-size="10" fill="#3498db">7-Segment A–G,DP</text>
  <text x="270" y="382" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P1.1–P1.4 (pins 2-5)</text>
  <text x="270" y="397" text-anchor="middle" font-family="Arial" font-size="10" fill="#27ae60">LED1–LED4 (220Ω each)</text>
  <text x="470" y="382" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P2.0–P2.3 (cols) · P2.4–P2.7 (rows)</text>
  <text x="470" y="397" text-anchor="middle" font-family="Arial" font-size="10" fill="#e67e22">4×4 Matrix Keypad</text>
  <text x="375" y="432" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Key press → 7-seg shows hex digit + LEDs show associated pattern. Column scan: pull col LOW, read row inputs.</text>
</svg>
