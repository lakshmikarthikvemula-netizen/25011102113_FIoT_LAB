<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480"><rect width="1000" height="480" fill="white"/><g font-family="sans-serif" fill="#17365d"><text x="30" y="45" font-size="26">CAT14: STM32F401RE environmental telemetry</text><rect x="35" y="90" width="350" height="300" fill="#edf3fa" stroke="#17365d"/><text x="65" y="130" font-size="22">NUCLEO-F401RE</text><text x="65" y="185" font-size="19">I2C1: PB8 / SCL, PB9 / SDA</text><text x="65" y="255" font-size="19">USART1: PA9 TX / PA10 RX</text><text x="65" y="325" font-size="19">USART2: PA2 TX / PA3 RX</text><g stroke="#17365d" stroke-width="3"><path d="M385 180H570"/><path d="M385 250H570"/><path d="M385 320H570"/></g><g font-size="19"><text x="590" y="185">BME280: SCL / SDA</text><text x="590" y="255">ESP8266: RX / TX</text><text x="590" y="325">ST-LINK USB serial</text><text x="35" y="425">Common GND; 3.3 V logic; I2C pull-ups; ESP8266 supply sized for current peaks.</text><text x="35" y="460">Software-derived wiring diagram. Physical wiring and behavior unverified.</text></g></g></svg>