<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430">
  <rect width="700" height="430" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="350" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#222">CAT 07 — 8051 LCD 4-Bit Interface</text>
  <text x="350" y="50" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">AT89S52 · 16×2 LCD (HD44780) · 4-bit mode via P3.2–P3.7</text>

  <!-- AT89S52 -->
  <rect x="60" y="80" width="160" height="260" rx="8" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">AT89S52</text>
  <text x="140" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">40-pin DIP</text>

  <!-- Left pins -->
  <text x="55" y="150" text-anchor="end" font-family="Arial" font-size="10" fill="#333">VCC</text>
  <line x1="60" y1="148" x2="40" y2="148" stroke="#e74c3c" stroke-width="2"/>
  <text x="55" y="168" text-anchor="end" font-family="Arial" font-size="10" fill="#333">GND</text>
  <line x1="60" y1="166" x2="40" y2="166" stroke="#2c3e50" stroke-width="2"/>
  <text x="55" y="186" text-anchor="end" font-family="Arial" font-size="10" fill="#333">XTAL1</text>
  <line x1="60" y1="184" x2="40" y2="184" stroke="#8e44ad" stroke-width="2"/>
  <text x="55" y="204" text-anchor="end" font-family="Arial" font-size="10" fill="#333">XTAL2</text>
  <line x1="60" y1="202" x2="40" y2="202" stroke="#8e44ad" stroke-width="2"/>
  <text x="55" y="222" text-anchor="end" font-family="Arial" font-size="10" fill="#333">RST</text>
  <line x1="60" y1="220" x2="40" y2="220" stroke="#e67e22" stroke-width="2"/>

  <!-- Right side — P3 pins -->
  <text x="225" y="168" text-anchor="start" font-family="Arial" font-size="10" fill="#2980b9">P3.2 → RS</text>
  <line x1="220" y1="166" x2="310" y2="166" stroke="#2980b9" stroke-width="2"/>

  <text x="225" y="192" text-anchor="start" font-family="Arial" font-size="10" fill="#16a085">P3.3 → EN</text>
  <line x1="220" y1="190" x2="310" y2="190" stroke="#16a085" stroke-width="2"/>

  <text x="225" y="216" text-anchor="start" font-family="Arial" font-size="10" fill="#8e44ad">P3.4 → D4</text>
  <line x1="220" y1="214" x2="310" y2="214" stroke="#8e44ad" stroke-width="2"/>

  <text x="225" y="240" text-anchor="start" font-family="Arial" font-size="10" fill="#c0392b">P3.5 → D5</text>
  <line x1="220" y1="238" x2="310" y2="238" stroke="#c0392b" stroke-width="2"/>

  <text x="225" y="264" text-anchor="start" font-family="Arial" font-size="10" fill="#e67e22">P3.6 → D6</text>
  <line x1="220" y1="262" x2="310" y2="262" stroke="#e67e22" stroke-width="2"/>

  <text x="225" y="288" text-anchor="start" font-family="Arial" font-size="10" fill="#27ae60">P3.7 → D7</text>
  <line x1="220" y1="286" x2="310" y2="286" stroke="#27ae60" stroke-width="2"/>

  <!-- LCD module -->
  <rect x="310" y="130" width="200" height="200" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="410" y="158" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">16×2 LCD</text>
  <text x="410" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#ecf0f1">HD44780 Compatible</text>

  <!-- LCD pins on left -->
  <text x="315" y="200" font-family="Arial" font-size="10" fill="white">1: VSS (GND)</text>
  <text x="315" y="215" font-family="Arial" font-size="10" fill="white">2: VDD (+5V)</text>
  <text x="315" y="230" font-family="Arial" font-size="10" fill="white">3: V0 (Contrast)</text>
  <text x="315" y="245" font-family="Arial" font-size="10" fill="#2980b9">4: RS ← P3.2</text>
  <text x="315" y="260" font-family="Arial" font-size="10" fill="white">5: RW (GND)</text>
  <text x="315" y="275" font-family="Arial" font-size="10" fill="#16a085">6: EN ← P3.3</text>
  <text x="315" y="295" font-family="Arial" font-size="10" fill="#8e44ad">11-14: D4–D7 ← P3.4–P3.7</text>

  <!-- Display text mockup -->
  <rect x="330" y="305" width="170" height="18" rx="3" fill="#2c3e50" stroke="#34495e"/>
  <text x="415" y="318" text-anchor="middle" font-family="monospace" font-size="10" fill="#2ecc71">MY CODE IS WORKING SIR!!</text>

  <!-- Contrast pot -->
  <rect x="530" y="195" width="60" height="22" rx="4" fill="#f39c12" stroke="#888" stroke-width="1.5"/>
  <text x="560" y="210" text-anchor="middle" font-family="Arial" font-size="9" fill="white">10kΩ Pot</text>
  <text x="560" y="224" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">V0 Contrast</text>
  <line x1="510" y1="206" x2="530" y2="206" stroke="#95a5a6" stroke-width="1.5"/>

  <!-- GND / VCC -->
  <line x1="40" y1="148" x2="30" y2="148" stroke="#e74c3c" stroke-width="2"/>
  <line x1="30" y1="148" x2="30" y2="80" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="30" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c">+5V</text>
  <line x1="40" y1="166" x2="30" y2="166" stroke="#2c3e50" stroke-width="2"/>
  <line x1="30" y1="166" x2="30" y2="380" stroke="#2c3e50" stroke-width="2"/>
  <line x1="30" y1="380" x2="610" y2="380" stroke="#2c3e50" stroke-width="2"/>
  <text x="320" y="396" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">GND</text>

  <!-- Crystal -->
  <rect x="10" y="178" width="20" height="30" rx="3" fill="#f39c12" stroke="#888"/>
  <text x="20" y="200" text-anchor="middle" font-family="Arial" font-size="7" fill="white">12MHz</text>

  <!-- Notes -->
  <text x="350" y="415" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">4-bit mode: upper nibble sent first, then lower nibble. RW tied to GND (write-only). V0 sets LCD contrast.</text>
</svg>
