<text x="38" y="415" font-size="15">External regulated 5 V supply</text>
<text x="552" y="415" font-size="15">Wemos 5 V input (if USB is disconnected)</text>
<text x="28" y="462" font-size="14">For a Wemos D1 mini, use USB or the illustrated 5 V feed. Tie grounds together.</text>
<text x="28" y="485" font-size="14">Use a 3.3 V BME280 interface and pull SCL/SDA up to 3.3 V if the breakout lacks pull-ups.</text>
<text x="28" y="508" font-size="14">For a configurable breakout, hold CSB high for I²C and set SDO for address 0x76 or 0x77.</text>
